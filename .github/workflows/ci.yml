name: CI

# A push to main that passes CI publishes a release candidate (release.yml). Docs-only changes publish none.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop

  specs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.3", "3.4", "4.0" ]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Replays the cassettes only: a missing one fails instead of reaching OpenWA.
      - run: bundle exec rspec
        env:
          VCR_RECORD_MODE: none
