name: CI

# A push to main that passes CI publishes a release candidate (release.yml). Changes to docs, to the issue and PR
# templates and the local OpenWA (docker-compose.yml) publish none.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "docker-compose.yml"
  pull_request:
  # Weekly, before Dependabot's updates (Mondays 07:00 America/Sao_Paulo): the audit finds advisories published since the
  # last change. A scheduled run publishes nothing (release.yml reacts to pushes only).
  schedule:
    - cron: "0 9 * * 1" # Mondays, 09:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop

  specs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.3", "3.4", "4.0" ]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Replays the cassettes only: a missing one fails instead of reaching OpenWA. .octocov.yml measures the test
      # execution time from the steps with this name, across the matrix.
      - name: Run the specs
        run: bundle exec rspec
        env:
          VCR_RECORD_MODE: none
      # The code is the same on every Ruby: one run's coverage is the gem's.
      - name: Upload coverage
        if: matrix.ruby == '4.0'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/.resultset.json
            coverage/coverage.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  # octocov (.octocov.yml): on a pull request, a comment with the coverage, its diff against main's and the test
  # execution time; on main, the report pull requests diff against. A coverage below the threshold fails it.
  coverage:
    needs: specs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - uses: k1LoW/octocov-action@v1

  # Advisories in the development bundle (Gemfile.lock); the runtime dependency (noticed) is in it too.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec bundler-audit check --update

  # The workflows, their shell steps included (the image runs shellcheck on each `run:`).
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
